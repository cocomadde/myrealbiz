function setLang(lang) {
  const d = T[lang];
  document.documentElement.lang = lang;
  document.title = d.docTitle;

  const on  = 'px-3 py-1 text-xs font-semibold rounded-md bg-amber-500 text-slate-950 shadow-sm transition';
  const off = 'px-3 py-1 text-xs font-semibold rounded-md text-slate-300 hover:text-white transition';
  document.getElementById('langKO').className = lang === 'ko' ? on : off;
  document.getElementById('langJA').className = lang === 'ja' ? on : off;

  document.querySelectorAll('[data-t]').forEach(el => {
    const v = d[el.getAttribute('data-t')];
    if (typeof v === 'string') el.innerHTML = v;
  });
}

window.addEventListener('DOMContentLoaded', () => setLang('ko'));
