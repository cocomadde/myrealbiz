<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포레스타 힐즈 (Foresta Hills) 투자분석 &amp; 융자 시뮬레이터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Pretendard', 'Noto Sans JP', -apple-system, system-ui, sans-serif; }
    html[lang="ja"] body { font-family: 'Noto Sans JP', 'Pretendard', system-ui, sans-serif; }
    .metric-card { transition: all .2s ease-in-out; }
    .metric-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0,0,0,.1); }
    input[type=range] { accent-color: #0284c7; }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; color: #000; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

  <!-- ══════════ HEADER ══════════ -->
  <header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center font-bold text-xl shadow-lg">🏢</div>
        <div>
          <div class="flex items-center flex-wrap gap-2">
            <h1 class="text-lg font-extrabold tracking-tight" data-t="headerTitle"></h1>
            <span class="px-2 py-0.5 text-xs font-semibold rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30" data-t="badgeCert"></span>
          </div>
          <p class="text-xs text-slate-400" data-t="headerSubtitle"></p>
        </div>
      </div>
      <div class="flex items-center space-x-2 no-print">
        <a href="../" class="px-2.5 py-1.5 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 flex items-center space-x-1 transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          <span data-t="btnBackHub"></span>
        </a>
        <div class="inline-flex rounded-lg border border-slate-700 bg-slate-800 p-1">
          <button id="langKO" onclick="setLanguage('ko')" class="px-3 py-1 text-xs font-semibold rounded-md transition">한국어</button>
          <button id="langJA" onclick="setLanguage('ja')" class="px-3 py-1 text-xs font-semibold rounded-md transition">日本語</button>
        </div>
        <button onclick="window.print()" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center space-x-1.5 transition">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2z"/></svg>
          <span data-t="btnPrint"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

    <!-- ══════════ HERO METRIC CARDS ══════════ -->
    <section class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 sm:gap-4">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm metric-card">
        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider block" data-t="hero_price"></span>
        <span class="text-xl sm:text-2xl font-black text-slate-900 mt-1 block" id="cardPriceDisplay">¥88,000,000</span>
        <span class="text-[11px] text-amber-600 font-medium" data-t="hero_price_tag"></span>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm metric-card">
        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider block" data-t="hero_fcr"></span>
        <span class="text-xl sm:text-2xl font-black text-emerald-600 mt-1 block" id="cardCapRate">8.42%</span>
        <span class="text-[11px] text-slate-400" id="cardNOIDisplay">NOI: ¥0</span>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm metric-card">
        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider block" data-t="hero_ccr"></span>
        <span class="text-xl sm:text-2xl font-black text-sky-600 mt-1 block" id="cardCCR">15.28%</span>
        <span class="text-[11px] text-slate-400" id="cardBTCFDisplay">BTCF: ¥0</span>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm metric-card">
        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider block" data-t="hero_dscr"></span>
        <span class="text-xl sm:text-2xl font-black text-indigo-600 mt-1 block" id="cardDSCR">2.08</span>
        <span class="text-[11px] font-medium" id="cardDSCRStatus"></span>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm metric-card">
        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider block" data-t="hero_ads"></span>
        <span class="text-xl sm:text-2xl font-black text-slate-900 mt-1 block" id="cardMonthlyADS">¥0</span>
        <span class="text-[11px] text-slate-400" id="cardAnnualADS"></span>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm metric-card">
        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider block" data-t="hero_equity"></span>
        <span class="text-xl sm:text-2xl font-black text-slate-900 mt-1 block" id="cardTotalEquity">¥0</span>
        <span class="text-[11px] text-slate-400" id="cardLoanAmountDisplay"></span>
      </div>
    </section>

    <!-- ══════════ INTERACTIVE SIMULATOR ══════════ -->
    <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden no-print">
      <div class="bg-gradient-to-r from-slate-900 via-slate-800 to-indigo-950 p-6 text-white flex flex-wrap justify-between items-center gap-4">
        <div>
          <div class="flex items-center flex-wrap gap-2">
            <span class="px-2.5 py-1 text-xs font-bold rounded-full bg-sky-500 text-white uppercase tracking-wider">Interactive Tool</span>
            <h2 class="text-xl font-extrabold tracking-tight" data-t="sim_title"></h2>
          </div>
          <p class="text-xs text-slate-300 mt-1" data-t="sim_desc"></p>
        </div>
        <div class="flex items-center flex-wrap gap-2">
          <span class="text-xs text-slate-400" data-t="preset_label"></span>
          <button onclick="setPricePreset(88000000)" id="presetA" class="px-2.5 py-1 text-xs rounded font-medium transition" data-t="preset_a"></button>
          <button onclick="setPricePreset(100000000)" id="presetB" class="px-2.5 py-1 text-xs rounded font-medium transition" data-t="preset_b"></button>
          <button onclick="setPricePreset(123000000)" id="presetC" class="px-2.5 py-1 text-xs rounded font-medium transition" data-t="preset_c"></button>
        </div>
      </div>

      <div class="p-6 grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- COLUMN 1: LOAN TERMS -->
        <div class="space-y-5 bg-slate-50/70 p-5 rounded-xl border border-slate-100">
          <h3 class="text-sm font-bold text-slate-900 border-b pb-2 flex items-center justify-between gap-2">
            <span data-t="col1_title"></span>
            <span class="text-xs font-normal text-sky-600" id="loanSummaryBadge"></span>
          </h3>

          <div>
            <div class="flex justify-between items-center text-xs mb-1.5">
              <label class="font-semibold text-slate-700" data-t="lbl_ltv"></label>
              <span class="font-bold text-sky-700 text-sm" id="valLTV">80%</span>
            </div>
            <input type="range" id="sliderLTV" min="50" max="100" step="5" value="80" class="w-full h-2 bg-slate-200 rounded-lg cursor-pointer">
            <div class="flex justify-between text-[10px] text-slate-400 mt-1">
              <span data-t="tick_ltv_1"></span><span data-t="tick_ltv_2"></span><span data-t="tick_ltv_3"></span>
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center text-xs mb-1.5">
              <label class="font-semibold text-slate-700" data-t="lbl_rate"></label>
              <span class="font-bold text-sky-700 text-sm" id="valRate">2.10%</span>
            </div>
            <input type="range" id="sliderRate" min="1.0" max="4.5" step="0.05" value="2.10" class="w-full h-2 bg-slate-200 rounded-lg cursor-pointer">
            <div class="flex justify-between text-[10px] text-slate-400 mt-1">
              <span data-t="tick_rate_1"></span><span data-t="tick_rate_2"></span><span data-t="tick_rate_3"></span>
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center text-xs mb-1.5">
              <label class="font-semibold text-slate-700" data-t="lbl_term"></label>
              <span class="font-bold text-sky-700 text-sm" id="valTerm"></span>
            </div>
            <input type="range" id="sliderTerm" min="15" max="35" step="1" value="25" class="w-full h-2 bg-slate-200 rounded-lg cursor-pointer">
            <div class="flex justify-between text-[10px] text-slate-400 mt-1">
              <span data-t="tick_term_1"></span><span data-t="tick_term_2"></span><span data-t="tick_term_3"></span><span data-t="tick_term_4"></span>
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center text-xs mb-1.5">
              <label class="font-semibold text-slate-700" data-t="lbl_loan_fee"></label>
              <span class="font-bold text-sky-700 text-sm" id="valLoanFee">2.0%</span>
            </div>
            <input type="range" id="sliderLoanFee" min="0" max="3.0" step="0.1" value="2.0" class="w-full h-2 bg-slate-200 rounded-lg cursor-pointer">
            <div class="flex justify-between text-[10px] text-slate-400 mt-1">
              <span>0%</span><span>1.5%</span><span data-t="tick_fee_std"></span><span>3.0%</span>
            </div>
          </div>
        </div>

        <!-- COLUMN 2: ACQUISITION & OPERATING -->
        <div class="space-y-5 bg-slate-50/70 p-5 rounded-xl border border-slate-100">
          <h3 class="text-sm font-bold text-slate-900 border-b pb-2 flex items-center justify-between gap-2">
            <span data-t="col2_title"></span>
            <span class="text-xs font-normal text-emerald-600" data-t="col2_badge"></span>
          </h3>

          <div>
            <div class="flex justify-between items-center text-xs mb-1.5">
              <label class="font-semibold text-slate-700" data-t="lbl_price"></label>
              <span class="font-bold text-slate-900 text-sm" id="valPriceFormatted">¥88,000,000</span>
            </div>
            <input type="range" id="sliderPrice" min="70000000" max="130000000" step="1000000" value="88000000" class="w-full h-2 bg-slate-200 rounded-lg cursor-pointer">
            <div class="flex justify-between text-[10px] text-slate-400 mt-1">
              <span data-t="tick_price_1"></span><span data-t="tick_price_2"></span><span data-t="tick_price_3"></span><span data-t="tick_price_4"></span>
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center text-xs mb-1.5">
              <label class="font-semibold text-slate-700" data-t="lbl_acq_fee"></label>
              <span class="font-bold text-slate-700 text-sm" id="valAcqCost">7.0%</span>
            </div>
            <input type="range" id="sliderAcqCost" min="4.0" max="10.0" step="0.5" value="7.0" class="w-full h-2 bg-slate-200 rounded-lg cursor-pointer">
            <div class="flex justify-between text-[10px] text-slate-400 mt-1">
              <span>5.0%</span><span data-t="tick_acq_std"></span><span>9.0%</span>
            </div>
          </div>

          <div>
            <label class="font-semibold text-slate-700 text-xs block mb-1.5" data-t="lbl_rent_scenario"></label>
            <div class="grid grid-cols-3 gap-2">
              <button onclick="setRentScenario('current')" id="btnRentCurrent" class="p-2 text-xs rounded-lg text-left transition">
                <span class="block font-bold" data-t="rent_scen_curr"></span>
                <span class="text-[10px] text-slate-500" data-t="rent_scen_curr_sub"></span>
              </button>
              <button onclick="setRentScenario('full')" id="btnRentFull" class="p-2 text-xs rounded-lg text-left transition">
                <span class="block font-bold" data-t="rent_scen_full"></span>
                <span class="text-[10px] text-slate-500" data-t="rent_scen_full_sub"></span>
              </button>
              <button onclick="setRentScenario('upside')" id="btnRentUpside" class="p-2 text-xs rounded-lg text-left transition">
                <span class="block font-bold text-emerald-700" data-t="rent_scen_up"></span>
                <span class="text-[10px] text-slate-500" data-t="rent_scen_up_sub"></span>
              </button>
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center text-xs mb-1.5">
              <label class="font-semibold text-slate-700" data-t="lbl_vacancy"></label>
              <span class="font-bold text-slate-900 text-sm" id="valVacancy">5.32%</span>
            </div>
            <input type="range" id="sliderVacancy" min="0" max="20" step="0.5" value="5.32" class="w-full h-2 bg-slate-200 rounded-lg cursor-pointer">
            <div class="flex justify-between text-[10px] text-slate-400 mt-1">
              <span data-t="tick_vac_1"></span><span data-t="tick_vac_2"></span><span data-t="tick_vac_3"></span><span>15%</span>
            </div>
          </div>
        </div>

        <!-- COLUMN 3: RESULTS -->
        <div class="bg-gradient-to-br from-slate-900 to-slate-800 text-white p-5 rounded-xl shadow-md space-y-4 flex flex-col justify-between">
          <div>
            <h3 class="text-sm font-bold text-sky-400 border-b border-slate-700 pb-2 flex items-center justify-between gap-2">
              <span data-t="col3_title"></span>
              <span class="px-2 py-0.5 text-[10px] font-bold rounded" id="badgeLeverage"></span>
            </h3>
            <div class="divide-y divide-slate-800/80 text-xs mt-3">
              <div class="py-2 flex justify-between gap-2"><span class="text-slate-400" data-t="calc_tot_acq"></span><span class="font-semibold text-white" id="resTotalCost"></span></div>
              <div class="py-2 flex justify-between gap-2"><span class="text-slate-400" data-t="calc_loan_amt"></span><span class="font-semibold text-sky-300" id="resLoanAmount"></span></div>
              <div class="py-2 flex justify-between gap-2"><span class="text-slate-400" data-t="calc_equity"></span><span class="font-semibold text-amber-300" id="resEquity"></span></div>
              <div class="py-2 flex justify-between gap-2"><span class="text-slate-400" data-t="calc_ads"></span><span class="font-semibold text-rose-300" id="resAnnualADS"></span></div>
              <div class="py-2 flex justify-between gap-2"><span class="text-slate-400" data-t="calc_loan_k"></span><span class="font-semibold text-white" id="resLoanK"></span></div>
              <div class="py-2 flex justify-between gap-2"><span class="text-slate-400" data-t="calc_noi"></span><span class="font-semibold text-emerald-400" id="resNOI"></span></div>
              <div class="py-2 flex justify-between gap-2 bg-slate-800/50 px-2 rounded font-bold"><span class="text-sky-300" data-t="calc_btcf"></span><span class="text-sky-300 text-sm" id="resBTCF"></span></div>
              <div class="py-2 flex justify-between gap-2"><span class="text-slate-400" data-t="calc_breakeven"></span><span class="font-semibold text-white" id="resBER"></span></div>
            </div>
          </div>
          <div class="pt-3 border-t border-slate-700/80">
            <div class="p-3 bg-slate-800/80 rounded-lg border border-slate-700 flex items-start space-x-2">
              <span class="text-base" id="statusEmoji">✅</span>
              <div>
                <span class="text-xs font-bold text-white block" id="statusVerdictTitle"></span>
                <span class="text-[11px] text-slate-300 block mt-0.5" id="statusVerdictDesc"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ══════════ CHARTS & HEATMAP ══════════ -->
    <section class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
        <div>
          <div class="flex justify-between items-center gap-2 mb-2">
            <h3 class="text-base font-bold text-slate-900" data-t="chart_amort_title"></h3>
            <span class="text-xs px-2.5 py-1 rounded bg-slate-100 text-slate-600 font-medium whitespace-nowrap" id="chartTermBadge"></span>
          </div>
          <p class="text-xs text-slate-500 mb-4" data-t="chart_amort_desc"></p>
          <div class="h-64 sm:h-72 w-full"><canvas id="amortizationChart"></canvas></div>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-100 grid grid-cols-3 gap-2 text-center text-xs">
          <div class="bg-slate-50 p-2 rounded">
            <span class="text-[10px] text-slate-400 block" data-t="stat_loan5y"></span>
            <span class="font-bold text-slate-800" id="statLoan5y"></span>
          </div>
          <div class="bg-slate-50 p-2 rounded">
            <span class="text-[10px] text-slate-400 block" data-t="stat_repaid10y"></span>
            <span class="font-bold text-emerald-600" id="statRepaid10y"></span>
          </div>
          <div class="bg-slate-50 p-2 rounded">
            <span class="text-[10px] text-slate-400 block" data-t="stat_interest"></span>
            <span class="font-bold text-rose-600" id="statTotalInterest"></span>
          </div>
        </div>
      </div>

      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
        <div>
          <div class="flex justify-between items-center gap-2 mb-2">
            <h3 class="text-base font-bold text-slate-900" data-t="heat_title"></h3>
            <div class="inline-flex rounded border border-slate-200 p-0.5 text-[11px] whitespace-nowrap">
              <button onclick="toggleHeatmapMetric('ccr')" id="btnHeatCCR" class="px-2 py-0.5 rounded font-medium">CCR (%)</button>
              <button onclick="toggleHeatmapMetric('dscr')" id="btnHeatDSCR" class="px-2 py-0.5 rounded font-medium">DSCR</button>
            </div>
          </div>
          <p class="text-xs text-slate-500 mb-3" data-t="heat_desc"></p>
          <div class="overflow-x-auto">
            <table class="w-full text-xs text-center border-collapse">
              <thead>
                <tr class="bg-slate-100 text-slate-600 font-semibold">
                  <th class="p-2 text-left" data-t="heat_axis"></th>
                  <th class="p-2">60%</th><th class="p-2">70%</th><th class="p-2">80%</th><th class="p-2">90%</th><th class="p-2">100%</th>
                </tr>
              </thead>
              <tbody id="heatmapBody" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2 text-[11px] text-slate-500">
          <div class="flex items-center space-x-3">
            <span class="flex items-center space-x-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span><span data-t="legend_best"></span></span>
            <span class="flex items-center space-x-1"><span class="w-2.5 h-2.5 rounded-full bg-sky-500 inline-block"></span><span data-t="legend_good"></span></span>
            <span class="flex items-center space-x-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></span><span data-t="legend_warn"></span></span>
            <span class="flex items-center space-x-1"><span class="w-2.5 h-2.5 rounded-full bg-rose-500 inline-block"></span><span data-t="legend_risk"></span></span>
          </div>
          <span class="text-slate-400" id="heatFootnote"></span>
        </div>
      </div>
    </section>

    <!-- ══════════ LEGAL / DOCUMENT AUDIT CARDS ══════════ -->
    <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8 space-y-6">
      <div class="border-b border-slate-200 pb-4 flex flex-wrap justify-between items-center gap-4">
        <div>
          <div class="flex items-center flex-wrap gap-2">
            <span class="px-2.5 py-1 text-xs font-bold rounded-full bg-emerald-100 text-emerald-800 uppercase tracking-wider" data-t="doc_pill"></span>
            <h2 class="text-xl font-extrabold text-slate-900" data-t="doc_title"></h2>
          </div>
          <p class="text-xs text-slate-500 mt-1" data-t="doc_subtitle"></p>
        </div>
        <span class="px-3 py-1 text-xs font-bold rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200" data-t="doc_verdict"></span>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5" id="docCardsGrid"></div>
    </section>

    <!-- ══════════ 2D PRICE × SEASONALITY MATRIX ══════════ -->
    <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8 space-y-6">
      <div class="flex flex-wrap justify-between items-center gap-4 border-b border-slate-200 pb-4">
        <div>
          <div class="flex items-center flex-wrap gap-2">
            <span class="px-2.5 py-1 text-xs font-bold rounded-full bg-indigo-100 text-indigo-800 uppercase tracking-wider" data-t="mat_pill"></span>
            <h2 class="text-xl font-extrabold text-slate-900" data-t="mat_title"></h2>
          </div>

   3. FINANCIAL ENGINE
   ═══════════════════════════════════════════════════════════ */
const state = {
  price: 88000000, ltv: 80, rate: 2.10, term: 25,
  loanFeePct: 2.0, acqCostPct: 7.0,
  rentScenario: 'full', vacancyPct: 5.32,
  heatmapMetric: 'ccr', lang: 'ko'
};

const TEPCO_INCOME = 33375;
const ANNUAL_OPEX = 1980000;
const RENT_DATA = {
  current: { annual: 794800 * 12 },
  full:    { annual: 881800 * 12 },
  upside:  { annual: 958800 * 12 }
};

const $ = id => document.getElementById(id);
const yen = n => '¥' + Math.round(n).toLocaleString();
const t = () => T[state.lang];

let amortChartInstance = null;

function calculate() {
  const P = state.price;
  const L = Math.round(P * state.ltv / 100);
  const loanFee = Math.round(L * state.loanFeePct / 100);
  const acqCost = Math.round(P * state.acqCostPct / 100);
  const totalCost = P + acqCost + loanFee;
  const equity = totalCost - L;

  const mRate = (state.rate / 100) / 12;
  const numPmt = state.term * 12;
  const monthlyPayment = mRate > 0
    ? L * (mRate * Math.pow(1 + mRate, numPmt)) / (Math.pow(1 + mRate, numPmt) - 1)
    : L / numPmt;
  const annualADS = Math.round(monthlyPayment * 12);
  const loanConstantK = L > 0 ? (annualADS / L) * 100 : 0;

  const baseGross = RENT_DATA[state.rentScenario].annual;
  const totalEGI = Math.round(baseGross * (1 - state.vacancyPct / 100) + TEPCO_INCOME);
  const noi = totalEGI - ANNUAL_OPEX;

  const capRate = (noi / P) * 100;
  const btcf = noi - annualADS;
  const ccr = equity > 0 ? (btcf / equity) * 100 : 0;
  const dscr = annualADS > 0 ? noi / annualADS : 999;
  const ber = ((ANNUAL_OPEX + annualADS) / (baseGross + TEPCO_INCOME)) * 100;

  return { P, L, totalCost, equity, monthlyPayment: Math.round(monthlyPayment),
           annualADS, loanConstantK, noi, capRate, btcf, ccr, dscr, ber };
}

  const badge = $('badgeLeverage');
  if (res.capRate > res.loanConstantK) {
    badge.textContent = 'Positive Leverage';

  } else {

  $('chartTermBadge').textContent = d.chartTermBadge(state.term);
  $('heatFootnote').textContent = d.heatFootnote(state.term);

  updateChart(res);
  renderHeatmap();
}

function updateChart(res) {
  const d = t();
  const mRate = (state.rate / 100) / 12;
  const labels = [], balanceData = [], equityData = [], interestData = [];
  let bal = res.L, cumInterest = 0;

  for (let yr = 1; yr <= 30; yr++) {
    labels.push(d.chart_x_year(yr));
    if (yr <= state.term && bal > 0) {
      for (let m = 0; m < 12; m++) {
        const intPart = bal * mRate;
        bal -= (res.monthlyPayment - intPart);
        cumInterest += intPart;
        if (bal < 0) bal = 0;
      }
    }
    balanceData.push(Math.round(bal / 10000));
    equityData.push(Math.round((state.price - bal) / 10000));
    interestData.push(Math.round(cumInterest / 10000));
  }

  $('statLoan5y').textContent = '¥' + (balanceData[4] / 100).toFixed(1) + 'M';
  $('statRepaid10y').textContent = '¥' + ((equityData[9] - equityData[0]) / 100).toFixed(1) + 'M';
  $('statTotalInterest').textContent = '¥' + (interestData[state.term - 1] / 100).toFixed(1) + 'M';

  if (amortChartInstance) amortChartInstance.destroy();
  amortChartInstance = new Chart($('amortizationChart').getContext('2d'), {
    type: 'line',
    data: { labels, datasets: [
      { label: d.chart_legend_balance, data: balanceData, borderColor: '#e11d48',
        backgroundColor: 'rgba(225,29,72,.08)', fill: true, tension: .3, pointRadius: 2 },
      { label: d.chart_legend_equity, data: equityData, borderColor: '#059669',
        backgroundColor: 'rgba(5,150,105,.08)', fill: true, tension: .3, pointRadius: 2 }
    ]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } },
        tooltip: { callbacks: { label: c => c.dataset.label + ': ' + yen(c.raw * 10000) } }
      },
      scales: {
        y: { ticks: { callback: v => (v / 100).toFixed(0) + 'M' }, grid: { color: '#f1f5f9' } },
        x: { grid: { display: false } }
      }
    }
  });
}

function renderHeatmap() {
  const tbody = $('heatmapBody');
  tbody.innerHTML = '';
  const testRates = [1.5, 2.0, 2.5, 3.0, 3.5];
  const testLTVs = [60, 70, 80, 90, 100];
  const P = state.price, n = state.term;
  const baseGross = RENT_DATA[state.rentScenario].annual;
  const noi = Math.round(baseGross * (1 - state.vacancyPct / 100) + TEPCO_INCOME) - ANNUAL_OPEX;

  testRates.forEach(rVal => {
    const tr = document.createElement('tr');
    const th = document.createElement('td');
    th.className = 'p-2 text-left font-bold text-slate-800 bg-slate-50';
    th.textContent = rVal.toFixed(1) + '%';
    tr.appendChild(th);

    testLTVs.forEach(ltvVal => {
      const td = document.createElement('td');
      td.className = 'p-2 font-mono font-bold transition';
      const L = P * ltvVal / 100;
      const eq = P + P * state.acqCostPct / 100 + L * state.loanFeePct / 100 - L;
      const mRate = (rVal / 100) / 12, numPmt = n * 12;
      const ads = L * (mRate * Math.pow(1 + mRate, numPmt)) / (Math.pow(1 + mRate, numPmt) - 1) * 12;
      const ccr = ((noi - ads) / eq) * 100;
      const dscr = noi / ads;

      if (state.heatmapMetric === 'ccr') {
        td.textContent = ccr.toFixed(1) + '%';
        if (ccr >= 15)      td.classList.add('bg-emerald-100', 'text-emerald-800');
        else if (ccr >= 10) td.classList.add('bg-sky-100', 'text-sky-800');
        else if (ccr >= 5)  td.classList.add('bg-amber-100', 'text-amber-800');
        else                td.classList.add('bg-rose-100', 'text-rose-800');
      } else {
        td.textContent = dscr.toFixed(2);
        if (dscr >= 1.5)       td.classList.add('bg-emerald-100', 'text-emerald-800');
        else if (dscr >= 1.3)  td.classList.add('bg-sky-100', 'text-sky-800');
        else if (dscr >= 1.15) td.classList.add('bg-amber-100', 'text-amber-800');
        else                   td.classList.add('bg-rose-100', 'text-rose-800');
      }
      if (Math.abs(rVal - state.rate) <= 0.25 && ltvVal === state.ltv) {
        td.classList.add('ring-2', 'ring-indigo-600', 'font-black');
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

      const danger = cell.danger ? ' bg-rose-100/70 border-2 border-rose-400' : '';
      const vClass = cell.danger ? 'font-bold text-rose-700' : (row.cellClass || 'font-bold text-slate-800');
      const subClass = cell.danger ? 'text-[10px] text-rose-600 font-medium' : 'text-[10px] text-slate-500';
      const tag = cell.tag ? `<br><span class="inline-block mt-1 px-1.5 py-0.5 ${cell.tagClass} font-bold text-[10px] rounded">${cell.tag}</span>` : '';
      return `<td class="p-3${danger}"><span class="${vClass}">${cell.v}</span><br><span class="${subClass}">${cell.sub}</span>${tag}</td>`;
    }).join('');
    tbody.insertAdjacentHTML('beforeend', `
      <tr class="${row.style}">
        <td class="p-3 text-left ${row.labelClass}">${c.label}<br>
          <span class="text-[10px] font-normal ${c.subClass || 'text-slate-500'}">${c.sub}</span>
        </td>${cells}
      </tr>`);
  });
}

function renderRentRoll() {
  const tbody = $('rentRollBody');
  tbody.innerHTML = '';
  RENT_ROLL.forEach(u => {
    const c = u[state.lang];
    let rowClass = 'hover:bg-slate-50';
    let unitClass = 'font-bold', rentClass = 'font-mono font-medium', noteClass = 'text-slate-600';
    if (u.highlight === 'sky')     { rowClass = 'bg-sky-50/50 hover:bg-sky-50'; unitClass = 'font-bold text-sky-800'; rentClass = 'font-mono font-bold text-sky-900'; noteClass = 'text-sky-900 font-medium'; }
    if (u.highlight === 'emerald') { rowClass = 'bg-emerald-50/50 hover:bg-emerald-50'; unitClass = 'font-bold text-emerald-800'; rentClass = 'font-mono font-bold text-emerald-900'; noteClass = 'text-emerald-900 font-medium'; }
    if (u.highlight === 'rose')    { rowClass = 'bg-rose-50 hover:bg-rose-100/70 border-2 border-rose-400'; unitClass = 'font-bold text-rose-700'; rentClass = 'font-mono font-bold text-rose-700'; noteClass = 'text-rose-700 font-bold'; }

    const gapText = c.gapText || ('+¥' + u.gap.toLocaleString());
    const gapClass = u.gap > 0 ? 'text-emerald-600' : (u.gap < 0 ? 'text-rose-600' : 'text-slate-400');
    const tenureClass = u.longTerm ? 'font-bold text-purple-700' : '';
    const startVal = c.start || u.start;
    const startClass = u.highlight === 'rose' ? 'text-rose-600 font-bold' : '';

    tbody.insertAdjacentHTML('beforeend', `
      <tr class="${rowClass}">
        <td class="p-2.5 text-center ${unitClass}">${u.unit}</td>
        <td class="p-2.5 text-center">${u.floor}</td>
        <td class="p-2.5 text-right ${rentClass}">¥${u.rent.toLocaleString()}</td>
        <td class="p-2.5 text-right font-mono">¥${u.fee.toLocaleString()}</td>
        <td class="p-2.5 text-center ${startClass}">${startVal}</td>
        <td class="p-2.5 text-center ${tenureClass}">${c.tenure}</td>
        <td class="p-2.5 text-center font-medium">${u.dom}${typeof u.dom === 'number' ? t().unit_days : ''}</td>
        <td class="p-2.5 text-right font-bold ${gapClass}">${gapText}</td>
        <td class="p-2.5 ${noteClass}">${c.note}</td>
      </tr>`);
  });
}

/* ═══════════════════════════════════════════════════════════
   5. LANGUAGE SWITCHER
   ═══════════════════════════════════════════════════════════ */
function setLanguage(lang) {
  state.lang = lang;
  const d = T[lang];

  document.documentElement.lang = lang;
  document.title = d.docTitle;

  const on  = 'px-3 py-1 text-xs font-semibold rounded-md bg-sky-600 text-white shadow-sm transition';
  const off = 'px-3 py-1 text-xs font-semibold rounded-md text-slate-300 hover:text-white transition';
  $('langKO').className = lang === 'ko' ? on : off;
  $('langJA').className = lang === 'ja' ? on : off;

  document.querySelectorAll('[data-t]').forEach(el => {
    const key = el.getAttribute('data-t');
    const val = d[key];
    if (typeof val === 'string') el.textContent = val;
  });

  renderDocCards();
  renderMatrix();
  renderRentRoll();
  refreshScenarioButtons();
  refreshPresetButtons();
  updateUI();
}

/* ═══════════════════════════════════════════════════════════
   6. CONTROLS
   ═══════════════════════════════════════════════════════════ */
function refreshScenarioButtons() {
  const base = 'p-2 text-xs rounded-lg border border-slate-200 bg-white font-medium hover:border-sky-500 text-left transition';
  const sel  = 'p-2 text-xs rounded-lg border-2 border-sky-600 bg-sky-50/50 font-medium text-left transition';
  const selG = 'p-2 text-xs rounded-lg border-2 border-emerald-600 bg-emerald-50/50 font-medium text-left transition';
  $('btnRentCurrent').className = state.rentScenario === 'current' ? sel : base;
  $('btnRentFull').className    = state.rentScenario === 'full'    ? sel : base;
  $('btnRentUpside').className  = state.rentScenario === 'upside'  ? selG : base;
}

function refreshPresetButtons() {
  const on  = 'px-2.5 py-1 text-xs rounded bg-sky-600 hover:bg-sky-500 text-white font-medium transition';
  const off = 'px-2.5 py-1 text-xs rounded bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium transition';
  $('presetA').className = state.price === 88000000  ? on : off;
  $('presetB').className = state.price === 100000000 ? on : off;
  $('presetC').className = state.price === 123000000 ? on : off;
}

function setPricePreset(v) {
  $('sliderPrice').value = v;
  state.price = v;
  refreshPresetButtons();
  updateUI();
}

function setRentScenario(s) {
  state.rentScenario = s;
  refreshScenarioButtons();
  updateUI();
}

function toggleHeatmapMetric(metric) {
  state.heatmapMetric = metric;
  const on  = 'px-2 py-0.5 rounded bg-sky-600 text-white font-medium';
  const off = 'px-2 py-0.5 rounded text-slate-600 font-medium';
  $('btnHeatCCR').className  = metric === 'ccr'  ? on : off;
  $('btnHeatDSCR').className = metric === 'dscr' ? on : off;
  renderHeatmap();
}

['sliderPrice','sliderLTV','sliderRate','sliderTerm','sliderLoanFee','sliderAcqCost','sliderVacancy']
  .forEach(id => {
    document.getElementById(id).addEventListener('input', e => {
      const v = parseFloat(e.target.value);
      if (id === 'sliderPrice')        { state.price = v; refreshPresetButtons(); }
      else if (id === 'sliderLTV')     state.ltv = v;
      else if (id === 'sliderRate')    state.rate = v;
      else if (id === 'sliderTerm')    state.term = v;
      else if (id === 'sliderLoanFee') state.loanFeePct = v;
      else if (id === 'sliderAcqCost') state.acqCostPct = v;
      else if (id === 'sliderVacancy') state.vacancyPct = v;
      updateUI();
    });
  });

window.addEventListener('DOMContentLoaded', () => {
  toggleHeatmapMetric('ccr');
  setLanguage('ko');
});
</script>
</body>
</html>
